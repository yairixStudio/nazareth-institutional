<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>כיוון מוסדי לנצרת</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ===== Common structure (layout-neutral; each style sets tokens and look) ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-size:15px;line-height:1.6}
[lang=he]{--fb:var(--f-he);--fd:var(--d-he)}
[lang=ar]{--fb:var(--f-ar);--fd:var(--d-ar)}
[lang=en]{--fb:var(--f-en);--fd:var(--d-en)}
[lang]{font-family:var(--fb)}
h1,h2,h3,.disp{font-family:var(--fd);text-wrap:balance;line-height:1.25}
h1,h2,h3,p{margin-block:0}
img,svg{max-width:100%}
[hidden]{display:none!important}
a{color:inherit}
p{max-width:72ch}
.wrap{max-width:var(--maxw,1180px);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
[dir=rtl] .ic.fw,[dir=rtl] .ic.sep{transform:scaleX(-1)}
[dir=ltr] .ic.bk{transform:scaleX(-1)}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--hdr-bg,var(--bg))}
.sketch-bar{font-size:12px;line-height:1.45;padding:5px max(16px,env(safe-area-inset-right,0px)) 5px max(16px,env(safe-area-inset-left,0px));text-align:center;background:var(--sketch-bg);color:var(--sketch-fg)}
.sketch-bar b{display:inline-block;padding:0 6px;margin-inline-end:6px;border:1px solid currentColor;font-weight:700;letter-spacing:.04em}

/* nav pieces */
.mega>ul{display:flex;list-style:none;margin:0;padding:0}
.mega li{position:relative;list-style:none}
.mega .top{display:flex;align-items:center;gap:4px;text-decoration:none;white-space:nowrap}
.mega .top .dn{width:14px;height:14px;opacity:.6}
.mega .panel{position:absolute;inset-inline-start:0;top:100%;min-width:230px;display:none;z-index:50}
.mega .panel ul{list-style:none;margin:0;padding:0}
.mega .panel a{display:block;text-decoration:none;white-space:nowrap}
.mega li:hover>.panel,.mega li:focus-within>.panel{display:block}
.drawer{position:fixed;inset:0;z-index:80;background:var(--scrim)}
.drawer-in{position:absolute;inset-block:0;inset-inline-start:0;width:min(360px,88vw);background:var(--surface);color:var(--fg);overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.drawer-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.drawer-er{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;padding:8px 10px;background:var(--danger-bg);color:var(--danger)}
.drawer-er span{display:inline-flex;gap:6px;align-items:center}
.acc{list-style:none;margin:0;padding:0}
.acc>li{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:11px 2px;font-weight:600;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc details[open] .dn{transform:rotate(180deg)}
.acc ul{list-style:none;margin:0;padding:0 8px 10px;display:grid;gap:2px}
.acc ul a{display:block;padding:6px 4px;text-decoration:none;color:var(--muted)}
.drawer-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}

/* placeholder art */
.art{margin:0;position:relative;overflow:hidden;background:var(--art-0);max-width:100%}
.art svg{display:block;width:100%;height:100%}
.art .a0{fill:var(--art-0)}.art .a1{fill:var(--art-1)}.art .a2{fill:var(--art-2)}.art .a3{fill:var(--art-3)}.art .a4{fill:var(--art-4)}
.art path[stroke]{stroke:var(--art-0)}
.art figcaption{position:absolute;inset-inline-start:8px;bottom:8px;font-size:11px;line-height:1.3;display:flex;gap:4px;align-items:center;padding:3px 7px;background:var(--cap-bg);color:var(--fg);max-width:calc(100% - 16px)}
.art figcaption .ic{width:13px;height:13px}

/* controls */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;min-width:0;width:100%}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;font-size:15px;padding:9px 16px;border-radius:var(--r-btn);border:1px solid transparent;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-h)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;font-size:13px}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);background:transparent;color:inherit;border-radius:var(--r-sm);cursor:pointer;flex:none}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;flex:none}
.langs button{font:inherit;font-size:13px;line-height:1.2;padding:5px 9px;background:transparent;border:0;color:inherit;cursor:pointer}
.langs button+button{border-inline-start:1px solid var(--line)}
.langs button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.search{display:flex;align-items:stretch;min-width:0}
.search input{border-start-end-radius:0;border-end-end-radius:0;border-inline-end:0}
.search button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:0 12px;border-start-end-radius:var(--r-sm);border-end-end-radius:var(--r-sm);cursor:pointer;font:inherit;font-weight:600}
input[type=search]::-webkit-search-decoration{display:none}
.tr-note{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:8px 12px;border:1px dashed var(--line);color:var(--muted);margin:0}
.tr-note .ic{margin-top:2px}
.demo-note{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin:0}
.demo-note .ic{width:14px;height:14px}
.form-ok{color:var(--ok);display:flex;gap:6px;align-items:center;font-weight:600}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}

/* shared lists and bits */
.muted{color:var(--muted)}.small{font-size:12px}
.ticks{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.ticks li{display:flex;gap:8px;align-items:flex-start}
.ticks .ic{color:var(--accent);margin-top:4px;width:16px;height:16px}
.chips{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.chips li{padding:3px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px}
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.tbl th{font-weight:600;color:var(--muted);font-size:13px}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:16px}
.cols3 h3{display:flex;align-items:center;gap:6px;font-size:16px;margin-bottom:4px}
.avatar{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--avatar-bg);color:var(--avatar-fg);font-weight:700;flex:none;font-family:var(--f-he);font-size:15px;line-height:1}
.avatar.sm{width:34px;height:34px;font-size:13px}
.avatar.xl{width:96px;height:96px;font-size:30px}
.kv{margin:0;display:grid;gap:8px}
.kv div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:end}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline}
.crumbs .sep{width:14px;height:14px;opacity:.6}
.phones{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.phones li{display:flex;justify-content:space-between;gap:12px}
.fbase{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:12px}
.flinks{display:flex;gap:12px;flex-wrap:wrap}

/* shared page structure */
.page-body{padding-block:24px 56px;display:grid;gap:32px}
.page-body>*{min-width:0}
.block{scroll-margin-top:var(--hdr-h,96px);display:grid;gap:12px;align-content:start;min-width:0}
.block>h2{display:flex;align-items:center;gap:8px}
.he-only{text-align:right;display:grid;gap:inherit}
.split{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}
.split>div{display:grid;gap:10px}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.art.side{aspect-ratio:4/3}
.timeline{list-style:none;margin:0;padding:0;border-inline-start:2px solid var(--line)}
.timeline li{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:8px 16px;position:relative}
.timeline li::before{content:"";position:absolute;inset-inline-start:-6px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
@media (max-width:480px){.timeline li{grid-template-columns:1fr;gap:0}}
.er-alert{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger)}
.er-alert div{display:flex;flex-direction:column}
.er-wait{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;padding:12px 16px;border:1px solid var(--line)}
.er-wait b{font-size:22px}.er-wait small{color:var(--muted)}
.er-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px}
.er-card{padding:16px;border:1px solid var(--line)}
.er-card h2{font-size:18px}
.news-list{display:grid}
.news-item{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:4px;justify-items:start}
.news-item h2{font-size:18px}
.news-item time{color:var(--muted);font-size:13px}
.tag{font-size:12px;padding:1px 8px;background:var(--tag-bg);color:var(--tag-fg);display:inline-block}
.events{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.events li{display:flex;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.jobs{list-style:none;padding:0;margin:0}
.jobs li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.jobs small{display:block;color:var(--muted)}
.amounts{display:flex;flex-wrap:wrap;gap:8px}
.amounts label{cursor:pointer;position:relative}
.amounts input{position:absolute;opacity:0;width:1px;height:1px}
.amounts span{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:var(--r-sm)}
.amounts input:checked+span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.amounts input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.donate-form{display:grid;gap:12px;max-width:520px;justify-items:start}
.donate-form .field{width:100%}
.res{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.res a{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);text-decoration:none;border-radius:var(--r-sm)}
.res a:hover{border-color:var(--accent)}
.res small{display:block;color:var(--muted)}.res span{min-width:0}
.search-page{max-width:640px}
.search-page input{padding-block:11px}
.empty{padding:16px;border:1px dashed var(--line);margin:0}
.heads{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:8px}
.heads a{display:flex;gap:10px;align-items:center;text-decoration:none;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm)}
.heads a:hover{border-color:var(--accent)}
.heads small{display:block;color:var(--muted);font-size:12px}
.doc-profile{display:grid;grid-template-columns:280px minmax(0,1fr);gap:32px;align-items:start}
.doc-side{display:grid;gap:14px;justify-items:start;padding:20px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.doc-side .kv{width:100%}
.doc-main{display:grid;gap:12px;max-width:68ch}
.doc-main .he-only{gap:12px}
@media (max-width:760px){.doc-profile{grid-template-columns:minmax(0,1fr)}}
.extras{padding-top:8px}

/* Layout: institutional grid, white field, one deep hospital blue, navy utility + footer bands, lots of air. */
:root{
  --bg:#ffffff;--surface:#f3f6fa;--fg:#0f1e33;--muted:#56677e;--line:#dbe3ec;--field:#ffffff;
  --accent:#1a56a6;--accent-h:#14478c;--on-accent:#ffffff;--navy:#0b2e5c;--on-navy:#e6eef8;--navy-muted:#a9bdd6;
  --danger:#b42318;--danger-bg:#fdf1f0;--ok:#16794a;--tag-bg:#e8f0fa;--tag-fg:#1a56a6;
  --avatar-bg:#e3ecf7;--avatar-fg:#1a56a6;--scrim:rgba(8,20,38,.45);--cap-bg:rgba(255,255,255,.88);
  --sketch-bg:#fff4d6;--sketch-fg:#5c4400;--hdr-bg:#0b2e5c;
  --art-0:#e7eef7;--art-1:#c9d9ec;--art-2:#a8c2e0;--art-3:#f2d9a6;--art-4:#ffffff;
  --r-sm:4px;--r-md:6px;--r-btn:4px;--maxw:1200px;--hdr-h:120px;
  --f-he:"IBM Plex Sans Hebrew","Arial Hebrew",Arial,sans-serif;--d-he:"IBM Plex Sans Hebrew","Arial Hebrew",Arial,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Geeza Pro",Tahoma,sans-serif;--d-ar:"IBM Plex Sans Arabic","Geeza Pro",Tahoma,sans-serif;
  --f-en:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;--d-en:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1420;--surface:#111d2c;--fg:#e4ebf4;--muted:#93a4ba;--line:#22324a;--field:#0e1926;
  --accent:#6ea8f0;--accent-h:#8dbaf3;--on-accent:#06121f;--navy:#071a33;--on-navy:#dbe6f3;--navy-muted:#8ea6c4;
  --danger:#ff8a80;--danger-bg:#2a1414;--ok:#5fd39a;--tag-bg:#15263c;--tag-fg:#8dbaf3;
  --avatar-bg:#18304f;--avatar-fg:#a9c8f2;--scrim:rgba(0,0,0,.6);--cap-bg:rgba(11,20,32,.85);
  --sketch-bg:#3a2f12;--sketch-fg:#f4dc9a;--hdr-bg:#071a33;
  --art-0:#13233a;--art-1:#1b3354;--art-2:#244670;--art-3:#6b5a33;--art-4:#2c3f5a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1420;--surface:#111d2c;--fg:#e4ebf4;--muted:#93a4ba;--line:#22324a;--field:#0e1926;
  --accent:#6ea8f0;--accent-h:#8dbaf3;--on-accent:#06121f;--navy:#071a33;--on-navy:#dbe6f3;--navy-muted:#8ea6c4;
  --danger:#ff8a80;--danger-bg:#2a1414;--ok:#5fd39a;--tag-bg:#15263c;--tag-fg:#8dbaf3;
  --avatar-bg:#18304f;--avatar-fg:#a9c8f2;--scrim:rgba(0,0,0,.6);--cap-bg:rgba(11,20,32,.85);
  --sketch-bg:#3a2f12;--sketch-fg:#f4dc9a;--hdr-bg:#071a33;
  --art-0:#13233a;--art-1:#1b3354;--art-2:#244670;--art-3:#6b5a33;--art-4:#2c3f5a;color-scheme:dark}
body{background:var(--bg);color:var(--fg)}
h1{font-size:clamp(26px,4vw,40px);font-weight:600;letter-spacing:-.01em}
h2{font-size:22px;font-weight:600}
h3{font-size:16px;font-weight:600}
.lead{font-size:17px;color:var(--muted)}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--accent);font-weight:600}
.lnk{display:inline-flex;align-items:center;gap:4px;color:var(--accent);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.lnk:hover{text-decoration:underline}

/* utility strip */
.util{background:var(--navy);color:var(--on-navy);font-size:13px}
.util-in{display:flex;align-items:center;gap:16px;min-height:40px;flex-wrap:wrap;padding-block:4px}
.er-pill{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.er-pill .ic{color:#ff9b91}
.sepdot{opacity:.5}
.util-links{display:flex;gap:16px;margin-inline-start:auto}
.util-links a{text-decoration:none;color:var(--navy-muted)}.util-links a:hover{color:var(--on-navy)}
.util-tools{display:flex;gap:8px;align-items:center}
.util .langs,.util .icon-btn{border-color:rgba(255,255,255,.25)}
.util .langs button+button{border-color:rgba(255,255,255,.25)}
.util .langs button[aria-pressed=true]{background:var(--on-navy);color:var(--navy)}
.util .icon-btn{width:30px;height:30px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:16px;min-height:68px}
.burger{display:none}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-inline-start:auto;min-width:0}
.brand-t{display:grid;line-height:1.15;text-align:end}
.brand-t b{font-size:20px;font-weight:700;color:var(--navy)}
:root[data-theme="dark"] .brand-t b{color:var(--fg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand-t b{color:var(--fg)}}
.brand-t small{font-size:12px;color:var(--muted);letter-spacing:.04em}
.hdr-search{flex:1;max-width:420px}
.navrow{border-top:1px solid var(--line)}
.mega>ul{gap:2px}
.mega .top{padding:11px 12px;font-weight:500;font-size:15px;border-bottom:2px solid transparent}
.mega li.on>.top,.mega .top:hover{color:var(--accent);border-bottom-color:var(--accent)}
.mega .panel{background:var(--bg);border:1px solid var(--line);border-top:2px solid var(--accent);padding:8px 0}
.mega .panel a{padding:8px 16px;font-size:14px}
.mega .panel a:hover{background:var(--surface);color:var(--accent)}
@media (max-width:1080px){
  .navrow,.hdr-search{display:none}
  .burger{display:inline-grid}
  .util-links{display:none}
  .util-tools{margin-inline-start:auto}
}
@media (max-width:560px){
  .hdr-in{min-height:58px;gap:10px}
  .hdr-book span{display:none}.hdr-book{padding:8px 10px}
  .brand-t b{font-size:17px}
  .er-pill{font-size:12px}
}

/* hero */
.hero{background:var(--surface);border-bottom:1px solid var(--line)}
.hero-in{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding-block:48px}
.hero-txt{display:grid;gap:16px;min-width:0}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-search{max-width:520px}
.hero-search input{padding-block:11px}
.hero-art{aspect-ratio:4/3;border-radius:var(--r-md)}

/* Appointment model */
function apptDays(n = 12) { const out = []; const d = new Date(); d.setHours(0, 0, 0, 0); while (out.length < n) { d.setDate(d.getDate() + 1); if (d.getDay() !== 6) out.push(new Date(d)); } return out; }
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const dayLbl = d => ({ dow: UI.days[S.lang][d.getDay()], dm: `${d.getDate()}.${d.getMonth() + 1}` });
function slots(docId, key) {
  const out = [];
  const skip = hash(docId + key) % 7; let i = 0;
  for (let m = 8 * 60; m <= 15 * 60 + 20; m += 20, i++) { const tm = `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; out.push({ tm, free: i >= skip && (hash(tm + '|' + key + '|' + docId) >> 2) % 3 !== 0 }); }
  return out;
}
function freeCount(docId, key) { return slots(docId, key).filter(s => s.free).length; }
function firstFree(docId) { for (const d of apptDays()) { const k = dayKey(d); const s = slots(docId, k).find(x => x.free); if (s) return { d, k, tm: s.tm }; } return null; }
function apptSet(k, v) {
  const A = S.appt; A[k] = v;
  if (k === 'dept') { A.doc = ''; A.day = ''; A.time = ''; A.step = 2; }
  if (k === 'doc') { A.day = ''; A.time = ''; A.step = 3; }
  if (k === 'day') { A.time = ''; }
  if (k === 'time') { A.step = 4; }
  renderMain(true);
}
function apptDocId() { const A = S.appt; return A.doc === 'any' ? (docsOf(A.dept)[0] || {}).id : A.doc; }
function apptSummary() {
  const A = S.appt, rows = [];
  if (A.dept) rows.push([t('pickDept'), L(dept(A.dept).name)]);
  if (A.doc) rows.push([t('pickDoctor'), A.doc === 'any' ? t('anyDoctor') : L(doc(A.doc).name)]);
  if (A.day) { const d = new Date(A.day + 'T00:00'); const l = dayLbl(d); rows.push([t('pickTime'), `${l.dow} ${num(l.dm)}${A.time ? ' · ' + num(A.time) : ''}`]); }
  return rows;
}

/* ===== Router and render ===== */
function parse() {
  const h = decodeURIComponent(location.hash.slice(1)) || 'home';
  if (PAGES.includes(h)) return { page: h };
  if (h.startsWith('dept-')) return { page: 'dept', id: h.slice(5) };
  if (h.startsWith('doctor-')) return { page: 'doctor', id: h.slice(7) };
  for (const p of PAGES) if (h.startsWith(p + '-')) return { page: p, sec: h.slice(p.length + 1) };
  return { page: 'home' };
}
function viewFor(r) { return VIEW[r.page] || SHARED[r.page] || SHARED.notFound; }
function renderMain(keep) {
  const r = parse(), y = window.scrollY, m = document.getElementById('main');
  if (r.page === 'appointment' && r.sec === 'imaging' && !S.appt.dept) { S.appt.dept = 'imaging'; S.appt.step = 2; }
  m.innerHTML = viewFor(r).call(VIEW, r);
  m.dataset.page = r.page;
  const g = GROUP_OF[r.page] || r.page;
  document.querySelectorAll('.mega li[data-g]').forEach(li => li.classList.toggle('on', li.dataset.g === g));
  document.querySelectorAll('[data-route]').forEach(a => a.classList.toggle('on', a.dataset.route === g));
  if (keep) window.scrollTo(0, y);
  else if (r.sec && document.getElementById('sec-' + r.sec)) document.getElementById('sec-' + r.sec).scrollIntoView({ block: 'start' });
  else window.scrollTo(0, 0);
  VIEW.after && VIEW.after(r);
}
function renderAll() {
  const d = document.documentElement; d.lang = S.lang; d.dir = LANGS[S.lang].dir;
  document.getElementById('app').innerHTML = VIEW.shell();
  renderMain(false);
}
function store(k, v) { try { localStorage.setItem(STYLE_ID + '-' + k, v); } catch (e) { } }
function load(k) { try { return localStorage.getItem(STYLE_ID + '-' + k); } catch (e) { return null; } }
function syncDrawer() { const dr = document.querySelector('.drawer'); if (dr) dr.hidden = !S.menu; document.body.classList.toggle('locked', S.menu); }

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  const link = e.target.closest('a[href^="#"]');
  if (link && !a) { if (S.menu) { S.menu = false; syncDrawer(); } if (link.getAttribute('href') === location.hash) { e.preventDefault(); renderMain(false); } document.activeElement && document.activeElement.blur && link.closest('.mega') && link.blur(); return; }
  if (!a) { if (S.menu && e.target.classList.contains('drawer')) { S.menu = false; syncDrawer(); } return; }
  const v = a.dataset.v;
  switch (a.dataset.act) {
    case 'lang': S.lang = v; store('lang', v); renderAll(); break;
    case 'theme': { const nx = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; store('theme', nx); a.innerHTML = ic(isDark() ? 'sun' : 'moon'); document.querySelectorAll('[data-act="theme"]').forEach(b => b.innerHTML = ic(isDark() ? 'sun' : 'moon')); break; }
    case 'menu': S.menu = !S.menu; syncDrawer(); if (S.menu) { const i = document.querySelector('.drawer input'); i && i.focus({ preventScroll: true }); } break;
    case 'appt': if (a.dataset.day) S.appt.day = a.dataset.day; apptSet(a.dataset.k, v); break;
    case 'appt-step': S.appt.step = +v; renderMain(true); break;
    case 'appt-reset': S.appt = { step: 1, dept: '', doc: '', day: '', time: '' }; renderMain(false); break;
    case 'appt-doc': { const d = doc(v); S.appt = { step: 3, dept: d.dept, doc: d.id, day: '', time: '' }; location.hash = 'appointment'; break; }
    case 'appt-dept': S.appt = { step: 2, dept: v, doc: '', day: '', time: '' }; location.hash = 'appointment'; break;
    case 'appt-quick': { const d = doc(v), ff = firstFree(v); S.appt = { step: 4, dept: d.dept, doc: v, day: ff.k, time: ff.tm }; location.hash = 'appointment'; break; }
    case 'set': S[a.dataset.k] = v; renderMain(true); break;
    default: VIEW.act && VIEW.act(a);
  }
});
document.addEventListener('submit', e => {
  const f = e.target, k = f.dataset.form; if (!k) return; e.preventDefault();
  if (k === 'search') { S.q = (f.q.value || '').trim(); S.menu = false; if (location.hash === '#search') renderMain(false); else location.hash = 'search'; return; }
  if (k === 'appt') { S.appt.name = f.name.value; S.appt.ref = 'NZ-' + (10000 + hash(f.name.value + S.appt.day + S.appt.time) % 90000); S.appt.step = 5; renderMain(false); return; }
  const ok = f.querySelector('.form-ok'); if (ok) { ok.hidden = false; f.querySelectorAll('input:not([type=radio]),textarea').forEach(i => i.value = ''); }
});
document.addEventListener('input', e => {
  if (e.target.dataset.appt) { apptSet(e.target.dataset.appt, e.target.value); return; }
  const b = e.target.dataset.bind; if (!b) return; S[b] = e.target.value;
  if (['dq', 'ddept', 'dlang'].includes(b)) { const el = document.getElementById('doc-results'); if (el) el.innerHTML = VIEW.docResults(); }
  if (b === 'deptq') { const el = document.getElementById('dept-results'); if (el) el.innerHTML = VIEW.deptResults(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.menu) { S.menu = false; syncDrawer(); } });
window.addEventListener('hashchange', () => { S.menu = false; syncDrawer(); renderMain(false); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => document.querySelectorAll('[data-act="theme"]').forEach(b => b.innerHTML = ic(isDark() ? 'sun' : 'moon')));
function boot() {
  const l = load('lang'); if (LANGS[l]) S.lang = l;
  const th = load('theme'); if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th;
  renderAll();
}

    </div><div class="navrow"><div class="wrap">${megaNav('', ['departments', 'doctors', 'appointment', 'visitors', 'emergency', 'about', 'news'])}</div></div></header>
    <main id="main" tabindex="-1"></main>
    <footer class="ftr"><div class="wrap ftr-in">
      <div class="fabout"><b class="disp">${L(HOSP.name)}</b><p>${t('footerAbout')}</p><p class="addr">${ic('pin')} ${L(HOSP.addr)}</p>${phonesList()}</div>
      <div class="fcols">${footerCols(['departments', 'visitors', 'emergency', 'about', 'careers'])}</div>
    </div><div class="wrap">${footerBase()}</div></footer>${drawer()}`;
  },
  phead(title, lead, crumbs) {
    return `<header class="phead"><div class="wrap"><nav class="crumbs" aria-label="breadcrumbs"><a href="#home">${t('home')}</a>${crumbs.map(c => `${ic('fwd', 'sep')}<a href="#${c[0]}">${c[1]}</a>`).join('')}${ic('fwd', 'sep')}<span aria-current="page">${title}</span></nav><h1>${title}</h1>${lead ? `<p class="lead">${lead}</p>` : ''}</div></header>`;
  },
  home() {
    const quick = [['appointment', 'cal', t('book')], ['doctors', 'user', t('findDoctor')], ['visitors-records', 'doc', hl('results')], ['visitors-hours', 'clock', t('hoursTitle')], ['visitors-parking', 'car', t('parking')]];
    return `<section class="hero"><div class="wrap hero-in"><div class="hero-txt"><p class="eyebrow">${hl('eyebrow')}</p><h1>${hl('heroT')}</h1><p class="lead">${hl('heroP')}</p>
      <div class="hero-cta"><a class="btn primary" href="#appointment">${ic('cal')} ${t('book')}</a><a class="btn ghost" href="#doctors">${ic('user')} ${t('findDoctor')}</a></div>
      ${searchForm('hero-search', 'q-hero', true)}</div>${art('hills', { he: 'מבט על בית החולים ונצרת', ar: 'منظر للمستشفى والناصرة', en: 'View of the hospital and Nazareth' }, 'hero-art')}</div></section>
    <section class="quick"><div class="wrap"><ul class="quick-row">${quick.map(q => `<li><a href="#${q[0]}">${ic(q[1])}<span>${q[2]}</span>${ic('fwd', 'fw')}</a></li>`).join('')}</ul></div></section>
    <section class="er-band"><div class="wrap er-in"><div><h2>${ic('pulse')} ${t('erOpen')}</h2><p>${hl('erP')}</p></div><dl class="er-nums"><div><dt>${t('erLine')}</dt><dd>${num(HOSP.er)}</dd></div><div><dt>${t('mda')}</dt><dd>${num('101')}</dd></div><div><dt>${t('waitNow')}</dt><dd>${num('35')} ${t('minutes')} <small>(${t('sample')})</small></dd></div></dl></div></section>
    <section class="sec"><div class="wrap"><div class="sec-head"><div><h2>${navL('departments')}</h2><p class="muted">${hl('deptsP')}</p></div><a class="lnk" href="#departments">${t('allDepts')} ${ic('fwd', 'fw')}</a></div>
      <ul class="dgrid">${DEPTS.slice(0, 8).map(d => `<li><a href="#dept-${d.id}"><span class="dic">${ic(d.ic)}</span><b>${L(d.name)}</b><small>${L(d.short)}</small></a></li>`).join('')}</ul></div></section>
    <section class="sec alt"><div class="wrap why"><div><h2>${hl('whyT')}</h2><ul class="why-list">${HA.why.map(w => `<li>${ic(w[2])}<div><h3>${L(w[0])}</h3><p>${L(w[1])}</p></div></li>`).join('')}</ul></div>
      <dl class="stats">${HA.stats.map(s => `<div><dt>${L(s[1])}</dt><dd>${num(s[0])}</dd></div>`).join('')}</dl></div></section>
    <section class="sec"><div class="wrap"><div class="sec-head"><h2>${hl('docsT')}</h2><a class="lnk" href="#doctors">${t('findDoctor')} ${ic('fwd', 'fw')}</a></div>
      <ul class="docrow">${DOCS.filter(d => d.role === 'head').slice(0, 4).map(d => `<li><a href="#doctor-${d.id}">${avatar(d)}<b>${L(d.name)}</b><small>${L(dept(d.dept).name)}</small></a></li>`).join('')}</ul><p class="small muted">${t('examples')}</p></div></section>
    <section class="sec alt"><div class="wrap two"><div><div class="sec-head"><h2>${navL('news')}</h2><a class="lnk" href="#news">${t('allNews')} ${ic('fwd', 'fw')}</a></div>
      <ul class="nlist">${NEWS.slice(0, 3).map(n => `<li><a href="#news"><time datetime="${n.date}">${fmtDate(n.date)}</time><span class="tag">${L(n.cat)}</span><b>${L(n.t)}</b></a></li>`).join('')}</ul></div>
      <div class="visit"><h2>${hl('visitT')}</h2><div class="vcard"><h3>${ic('clock')} ${t('hoursTitle')}</h3><p>${hl('visitHours')}: ${num('11:00–13:00')}, ${num('16:00–20:30')}</p><a class="lnk" href="#visitors-hours">${t('more')} ${ic('fwd', 'fw')}</a></div>
      <div class="vcard"><h3>${ic('car')} ${t('parking')}</h3><p>${hl('visitPark')}</p><a class="lnk" href="#visitors-parking">${t('more')} ${ic('fwd', 'fw')}</a></div></div></div></section>
    <section class="don"><div class="wrap don-in"><div><h2>${hl('donT')}</h2><p>${hl('donP')}</p></div><a class="btn light" href="#donate">${ic('heartHand')} ${hl('donB')}</a></div></section>`;
  },
  departments(r) {
    return this.phead(navL('departments'), hl('deptsP'), []) + `<div class="wrap page-body"><div class="filter-bar"><div class="field"><label for="deptq">${t('search')}</label><input id="deptq" data-bind="deptq" type="search" value="${esc(S.deptq)}" placeholder="${t('searchPh')}"></div></div><div id="dept-results">${this.deptResults()}</div></div>`;
  },
  deptResults() {
    const list = filterDepts();
    if (!list.length) return `<p class="empty">${t('noResults')}</p>`;
    return DEPT_GROUPS.map(g => { const ds = list.filter(d => d.type === g); if (!ds.length) return ''; return `<section class="block" id="sec-${g}"><h2>${t(g)} <span class="count">${num(ds.length)}</span></h2><ul class="drows">${ds.map(d => `<li><a href="#dept-${d.id}"><span class="dic">${ic(d.ic)}</span><span class="dtx"><b>${L(d.name)}</b><small>${L(d.short)}</small></span>${ic('fwd', 'fw')}</a></li>`).join('')}</ul></section>`; }).join('');
  },
  dept(r) {
    const d = dept(r.id); if (!d) return SHARED.notFound();
    const team = docsOf(d.id);
    return this.phead(L(d.name), L(d.short), [['departments', navL('departments')], ['departments-' + d.type, t(d.type)]]) + `<div class="wrap page-body"><div class="dept-layout"><div class="dept-main">
      ${art('clinic', { he: 'צוות המחלקה בעבודה', ar: 'طاقم القسم أثناء العمل', en: 'The ward team at work' }, 'dept-art')}${trNote()}
      ${heOnly(`<section class="block"><h2>על המחלקה</h2><p>${d.about}</p></section><section class="block"><h2>${UI.services.he}</h2><ul class="ticks two-col">${d.services.map(s => `<li>${ic('check')} ${s}</li>`).join('')}</ul></section>`)}
      <section class="block"><h2>${t('team')}</h2><ul class="team">${team.map(m => `<li><a href="#doctor-${m.id}">${avatar(m)}<span><b>${L(m.name)}</b><small>${m.id === d.head ? t('head') : roleL(m)}</small></span></a></li>`).join('')}</ul><p class="small muted">${t('examples')}</p></section></div>
      <aside class="dept-side"><div class="side-box"><h3>${t('contactUs')}</h3><dl class="kv"><div><dt>${ic('pin')} ${t('location')}</dt><dd lang="he">${d.where}</dd></div><div><dt>${ic('phone')} ${t('phoneLbl')}</dt><dd>${num('04-XXX-' + (2000 + hash(d.id) % 7000))}</dd></div><div><dt>${ic('clock')}</dt><dd>${d.type === 'inpatient' ? t('open247') : num('08:00–15:00')}</dd></div></dl>
      ${d.id === 'emergency-dept' ? `<a class="btn primary block" href="#emergency">${navL('emergency')}</a>` : `<button type="button" class="btn primary block" data-act="appt-dept" data-v="${d.id}">${ic('cal')} ${t('book')}</button>`}</div>
      <div class="side-box muted-box"><h3>${ic('alert')} ${t('emergencyNow')}</h3><p>${t('erLine')} ${num(HOSP.er)}</p></div></aside></div></div>`;
  },
  doctors(r) {
    return this.phead(navL('doctors'), '', []) + `<div class="wrap page-body"><section class="block">${docFilters('filter-bar')}<div id="doc-results">${this.docResults()}</div></section>${doctorsExtras()}</div>`;
  },
  docResults() {
    const list = filterDocs();
    if (!list.length) return `<p class="empty">${t('noResults')}</p>`;
    return `<p class="muted small">${num(list.length)} ${t('results')} · ${t('examples')}</p><div class="tbl-wrap"><table class="tbl doc-tbl"><thead><tr><th>${t('doctors')}</th><th>${t('pickDept')}</th><th>${t('speaks')}</th><th></th></tr></thead><tbody>${list.map(d => `<tr><td><a class="dname" href="#doctor-${d.id}">${avatar(d, 'sm')}<span><b>${L(d.name)}</b><small>${roleL(d)}</small></span></a></td><td>${L(dept(d.dept).name)}</td><td>${langsL(d)}</td><td><button type="button" class="btn ghost sm" data-act="appt-doc" data-v="${d.id}">${t('bookShort')}</button></td></tr>`).join('')}</tbody></table></div>`;
  },
  appointment(r) {
    const A = S.appt, names = [t('pickDept'), t('pickDoctor'), t('pickTime'), t('details'), t('confirm')];
    let body = '';
    if (A.step === 1) body = `<h2>${names[0]}</h2><div class="pick-grid">${APPT_DEPTS().map(d => `<button type="button" class="pick ${A.dept === d.id ? 'on' : ''}" data-act="appt" data-k="dept" data-v="${d.id}">${ic(d.ic)}<span>${L(d.name)}</span></button>`).join('')}</div>`;
    else if (A.step === 2) body = `<h2>${names[1]}</h2><div class="pick-list"><button type="button" class="pick row" data-act="appt" data-k="doc" data-v="any">${ic('users')}<span><b>${t('anyDoctor')}</b></span></button>${docsOf(A.dept).map(d => { const ff = firstFree(d.id); return `<button type="button" class="pick row ${A.doc === d.id ? 'on' : ''}" data-act="appt" data-k="doc" data-v="${d.id}">${avatar(d, 'sm')}<span><b>${L(d.name)}</b><small>${roleL(d)} · ${langsL(d)}</small></span>${ff ? `<em>${t('nearest')}: ${dayLbl(ff.d).dow} ${num(dayLbl(ff.d).dm)}</em>` : ''}</button>`; }).join('')}</div><div class="row-btns"><button type="button" class="btn ghost" data-act="appt-step" data-v="1">${ic('fwd', 'bk')} ${t('back')}</button></div>`;
    else if (A.step === 3) { const id = apptDocId(), days = apptDays(10); const day = A.day || dayKey(days[0]);
      body = `<h2>${names[2]}</h2><div class="days">${days.map(d => { const k = dayKey(d), l = dayLbl(d); return `<button type="button" class="day ${k === day ? 'on' : ''}" data-act="appt" data-k="day" data-v="${k}"><small>${l.dow}</small><b>${num(l.dm)}</b><em>${num(freeCount(id, k))} ${t('free')}</em></button>`; }).join('')}</div>
      <div class="slots">${slots(id, day).map(s => `<button type="button" class="slot" ${s.free ? `data-act="appt" data-k="time" data-v="${s.tm}"` : 'disabled'} data-day="${day}">${num(s.tm)}</button>`).join('')}</div><div class="row-btns"><button type="button" class="btn ghost" data-act="appt-step" data-v="2">${ic('fwd', 'bk')} ${t('back')}</button></div>`; }
    else if (A.step === 4) body = `<h2>${names[3]}</h2>${apptForm()}`;
    else body = `<div class="done">${ic('check')}<h2>${t('booked')}</h2><p class="ref">${num(A.ref)}</p><dl class="kv">${apptSummary().map(r => `<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join('')}</dl><p class="demo-note">${ic('lock')} ${t('demoNote')}</p><button type="button" class="btn primary" data-act="appt-reset">${t('newAppt')}</button></div>`;
    const sum = apptSummary();
    return this.phead(navL('appointment'), '', []) + `<div class="wrap page-body"><ol class="stepper">${names.map((n, i) => `<li class="${A.step === i + 1 ? 'cur' : A.step > i + 1 ? 'past' : ''}"><span>${num(i + 1)}</span><em>${n}</em></li>`).join('')}</ol>
      <div class="appt-layout"><div class="appt-body">${body}</div><aside class="side-box appt-sum"><h3>${hl('summary')}</h3>${sum.length ? `<dl class="kv">${sum.map(r => `<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join('')}</dl>` : `<p class="muted">—</p>`}<p class="small muted">${t('apptLine')} ${num(HOSP.appt)}</p></aside></div>${apptExtras()}</div>`;
  },
  contact(r) {
    return this.phead(navL('contact'), '', []) + `<div class="wrap page-body"><div class="contact-grid">
      <section class="block" id="sec-phones"><h2>${ic('phone')} ${L(NAV[9].items[0].l)}</h2><div class="tbl-wrap"><table class="tbl"><tbody>
        <tr><td>${t('switchboard')}</td><td>${num(HOSP.phone)}</td></tr><tr><td>${t('erLine')}</td><td>${num(HOSP.er)}</td></tr><tr><td>${t('apptLine')}</td><td>${num(HOSP.appt)}</td></tr><tr><td>${navL('emergency')} · ${t('mda')}</td><td>${num('101')}</td></tr><tr><td>${L({ he: 'דוא״ל', ar: 'البريد الإلكتروني', en: 'Email' })}</td><td><bdi dir="ltr">${HOSP.email}</bdi></td></tr></tbody></table></div>
        <p class="addr">${ic('pin')} ${L(HOSP.addr)}</p>${art('hills', { he: 'מפת הגעה', ar: 'خريطة الوصول', en: 'Map' }, 'map')}</section>
      <section class="block" id="sec-form"><h2>${ic('mail')} ${hl('writeUs')}</h2><form class="cform" data-form="contact">
        <div class="field"><label for="c-name">${t('fullName')}</label><input id="c-name" required></div>
        <div class="field"><label for="c-tel">${t('mobile')}</label><input id="c-tel" type="tel" dir="ltr"></div>
        <div class="field"><label for="c-sub">${hl('subject')}</label><select id="c-sub">${NAV.slice(0, 6).map(n => `<option>${L(n.l)}</option>`).join('')}</select></div>
        <div class="field"><label for="c-msg">${hl('message')}</label><textarea id="c-msg"></textarea></div>
        <p class="demo-note">${ic('lock')} ${t('demoNote')}</p><button class="btn primary">${t('sendDemo')}</button><p class="form-ok" hidden>${ic('check')} ${hl('sentOk')}</p></form></section></div>
      <section class="block" id="sec-feedback">${trNote()}${heOnly(`<h2>פניות הציבור</h2><p>יש לכם הערה, תלונה או מחמאה לצוות? נציבת פניות הציבור של בית החולים מטפלת בכל פנייה ועונה בכתב תוך 14 יום. אפשר לפנות בטופס, בדוא״ל או בפגישה אישית בתיאום מראש.</p>`)}</section></div>`;
  }
});
boot();

</script>

</body></html>
